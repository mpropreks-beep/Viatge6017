<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d4aff">
<title>Viatge — Mapa del viatge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   🎨 COLORS BASE — es poden sobreescriure al fitxer estils.css
   (pujat al costat d'aquest index.html a GitHub) i també des
   del Google Sheet, pestanya Config (claus color_*).
   Ordre de prioritat: base < estils.css < Sheet
   ============================================================ */
:root{
  --pri:#6d4aff;
  --fons:#f4f1fc;
  --targeta:rgba(255,255,255,.68);
  --text:#221a44;
  --muted:#6f6795;
  --borde:rgba(109,74,255,.14);
  --c-hotel:#6d4aff;
  --c-activitat:#e8618c;
  --c-transport:#0ea5a4;
  --c-botiga:#e8963c;
  --c-restaurant:#d94f3d;
  --c-cafeteria:#8a6440;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);overflow:hidden}
body{
  background:linear-gradient(155deg,#efe9ff 0%,#fdeef5 38%,#eaf7f6 72%,#f7f2e8 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;
}
/* ---------- Pantalla de càrrega ---------- */
#splash{
  position:fixed;inset:0;z-index:6000;isolation:isolate;
  background:linear-gradient(160deg,#f6f3ff 0%,#fdf1f6 55%,#eff8f7 100%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  transition:opacity .45s ease;
}
#splash.amaga{opacity:0;pointer-events:none}
#splash .slogo{
  width:92px;height:92px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.7);
  box-shadow:0 14px 40px rgba(109,74,255,.28);
}
#splash .stxt{position:relative;z-index:2;font-size:15px;font-weight:700;color:var(--muted)}
#splash .spin{position:relative;z-index:2;width:26px;height:26px;border-radius:50%;border:3px solid rgba(109,74,255,.2);border-top-color:var(--pri);animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
/* ---------- Capçalera aurora ---------- */
/* ---------- Capçalera: barra fina única ---------- */
header{
  display:flex;align-items:center;gap:9px;
  height:calc(46px + env(safe-area-inset-top));
  padding:calc(6px + env(safe-area-inset-top)) 12px 6px;
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);flex:none;
  border-bottom:1px solid var(--borde);
  box-shadow:0 2px 12px rgba(34,26,68,.06);
}
header .hsimbol{flex-shrink:0;display:inline-flex;filter:drop-shadow(0 2px 6px rgba(109,74,255,.25))}
h1{font-size:14.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hsync{flex-shrink:0;font-size:10px;font-weight:700;background:rgba(22,163,74,.12);color:#15803d;
  padding:3px 8px;border-radius:12px;white-space:nowrap;cursor:default}
.hsync.off{background:rgba(217,79,61,.12);color:#b91c1c}
.dates,.counts{display:none}
/* ---------- Filtres vidre ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;flex:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;border:1px solid var(--borde);border-radius:22px;padding:7px 13px;font-size:13.5px;font-weight:600;
  background:var(--targeta);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--muted);box-shadow:0 2px 10px rgba(34,26,68,.07);cursor:pointer;transition:.15s;
}
.chip.on{color:#fff;border-color:transparent}
select.chip{appearance:none;-webkit-appearance:none;font-family:inherit;outline:none;max-width:240px;white-space:nowrap}
/* ---------- Panells: la visibilitat depèn de la classe del body ----------
   El padding-bottom generós evita que l'últim element quedi tallat. */
#content{flex:1;position:relative;overflow:hidden}
#map{position:absolute;top:0;left:0;right:0;bottom:64px;display:none;border-radius:0}
.main{position:absolute;top:0;left:0;right:0;bottom:64px;overflow-y:auto;padding:4px 14px 64px;display:none}
body.view-map  #map{display:block}
body.view-llis #llistes{display:block}
body.view-itin #itinerari{display:block}
/* ---------- Targetes vidre ---------- */
.cat-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin:18px 2px 8px;letter-spacing:.2px}
.cat-title .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor}
.cat-title small{color:var(--muted);font-weight:600;font-size:13px}
.item{
  background:var(--targeta);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--borde);border-radius:16px;
  box-shadow:0 4px 18px rgba(34,26,68,.08);
  padding:13px 15px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start;
  transition:transform .15s, box-shadow .15s;
}
.item:active{transform:scale(.985)}
.item .ico{font-size:22px;line-height:1.2;flex-shrink:0}
.item b{font-size:15px}
.item p{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-line}
.item .meta{font-size:12px;color:var(--pri);font-weight:700;margin-top:4px}
.item .go{margin-left:auto;flex-shrink:0;border:none;background:rgba(109,74,255,.12);color:var(--pri);border-radius:10px;
          padding:8px 10px;font-size:15px;font-weight:700;cursor:pointer}
/* ---------- Pin ---------- */
.pin{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50% 50% 50% 4px;
     transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 4px 14px rgba(34,26,68,.35);font-size:16px}
.pin > span{transform:rotate(45deg)}
/* ---------- Navegació ---------- */
nav{position:absolute;left:0;right:0;bottom:0;height:64px;
    background:var(--targeta);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom);z-index:1200;display:flex}
nav button{flex:1;border:none;background:none;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ni{font-size:20px}
nav button.on{color:var(--pri)}
/* ---------- Escriptori ---------- */
@media (min-width:900px){
  #map{right:42%;bottom:0;display:block !important}
  body.view-llis #llistes,
  body.view-itin #itinerari{left:58%;bottom:0;border-left:1px solid var(--borde);display:block !important}
  nav{left:58%;width:42%}
}
/* ---------- Itinerari ---------- */
.dia-bloc{margin:18px 0 6px}
.dia-cap{display:inline-flex;align-items:center;gap:8px;background:var(--targeta);backdrop-filter:blur(14px);
  border:1px solid var(--borde);border-radius:20px;padding:7px 16px;font-weight:800;font-size:15px;
  box-shadow:0 3px 12px rgba(34,26,68,.09);margin-bottom:12px}
.dia-cap .ndia{background:var(--pri);color:#fff;border-radius:14px;font-size:12px;padding:2px 9px}
.timeline{position:relative;margin-left:10px;padding-left:20px;border-left:2.5px solid rgba(109,74,255,.25)}
.tstop{position:relative;margin-bottom:14px}
.tstop::before{
  content:"";position:absolute;left:-27.5px;top:14px;width:13px;height:13px;border-radius:50%;
  background:var(--dot,#6d4aff);border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(109,74,255,.2), 0 2px 8px rgba(34,26,68,.25);
}
.tstop .thora{font-size:12px;font-weight:800;color:var(--dot,#6d4aff)}
/* ---------- Avís ---------- */
.aviso{position:absolute;left:12px;right:12px;top:12px;z-index:1500;
  background:rgba(255,244,229,.95);backdrop-filter:blur(10px);color:#8a5a00;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;
  box-shadow:0 6px 20px rgba(34,26,68,.15);display:none;max-height:40vh;overflow-y:auto}
/* ---------- Fitxa detall ----------
   Dos estats: col·lapsada (mitja pantalla) i expandida (gairebé tota).
   Gestos: lliscar AMUNT → expandir · lliscar AVALL → tancar            */
#fitxa{position:fixed;inset:0;z-index:3000;display:none;align-items:flex-end;justify-content:center}
#fitxa.open{display:flex}
#fitxa .fons{position:absolute;inset:0;background:rgba(34,26,68,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#fitxa .full{
  position:relative;width:100%;max-width:560px;max-height:62vh;overflow-y:auto;overscroll-behavior:contain;
  background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(34,26,68,.3);
  transition:max-height .28s ease, transform .2s ease;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  touch-action:pan-y;
}
#fitxa.expans .full{max-height:94vh}
@keyframes puge{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#fitxa .full.anim{animation:puge .28s ease}
#fitxa .agarra{width:44px;height:5px;border-radius:3px;background:rgba(34,26,68,.18);margin:12px auto 4px}
#fitxa .tanca{position:absolute;top:14px;right:14px;border:none;width:36px;height:36px;border-radius:50%;
  background:rgba(34,26,68,.08);color:var(--muted);font-size:17px;font-weight:800;cursor:pointer;z-index:2}
#fitxa .fh{display:flex;align-items:center;gap:14px;padding:10px 22px 6px;cursor:grab}
#fitxa .femoji{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;flex-shrink:0;box-shadow:0 6px 18px rgba(34,26,68,.25)}
#fitxa .ftitul{font-size:20px;font-weight:800;line-height:1.25}
#fitxa .fcat{font-size:12.5px;font-weight:700;margin-top:3px}
#fitxa .fcos{padding:6px 22px}
#fitxa .fila{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--borde)}
#fitxa .fila:last-child{border-bottom:none}
#fitxa .fic{font-size:19px;flex-shrink:0;line-height:1.3}
#fitxa .flabel{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#fitxa .fvalor{font-size:14.5px;margin-top:1px;white-space:pre-line}
#fitxa .faccions{display:flex;gap:10px;padding:16px 22px 4px;flex-wrap:wrap}
#fitxa .faccions a,#fitxa .faccions button{
  flex:1;min-width:140px;text-align:center;border:none;border-radius:14px;padding:13px 10px;
  font-size:14.5px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .12s}
#fitxa .faccions a:active{transform:scale(.97)}
.f-acc-pri{background:var(--acc,#6d4aff);color:#fff;box-shadow:0 5px 16px rgba(34,26,68,.25)}
.f-acc-sec{background:rgba(109,74,255,.12);color:var(--pri)}
/* ---------- Porta de contrasenya ---------- */
#gate{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#6d4aff 0%,#a46bff 45%,#e8618c 100%);}
#gate::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 20% 25%,rgba(255,255,255,.25),transparent 40%),
             radial-gradient(circle at 80% 75%,rgba(255,255,255,.18),transparent 45%);}
#gate .gbox{position:relative;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.6);border-radius:24px;padding:30px 24px;max-width:380px;width:100%;
  box-shadow:0 20px 60px rgba(34,26,68,.35);text-align:center}
#gate .gmasc{font-size:44px}
#gate h2{font-size:18px;font-weight:800;margin:10px 0 4px}
#gate p{font-size:13.5px;color:var(--muted);margin-bottom:16px}
#gate input{width:100%;border:1.5px solid #ddd8ee;border-radius:14px;padding:13px 14px;font-size:16px;
  text-align:center;letter-spacing:2px;background:#fff;outline:none}
#gate input:focus{border-color:var(--pri)}
#gate .err{color:#d94f3d;font-size:13px;font-weight:700;margin-top:10px;display:none}
#gate button{width:100%;margin-top:14px;border:none;background:linear-gradient(135deg,#6d4aff,#a46bff);color:#fff;border-radius:14px;
  padding:13px;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(109,74,255,.4)}
#gate button:active{transform:scale(.98)}

/* Pantalla de càrrega — fons il·lustrat rotatiu */
#splash .sfoto{position:absolute;inset:0;z-index:0}
#splash .sfoto img{width:100%;height:100%;object-fit:cover}
#splash .svel{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.12))}
#splash .slogo{position:relative;z-index:2;background:rgba(255,255,255,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(34,26,68,.18)}
#splash .stxt{position:relative;z-index:2}
#splash .spin{position:relative;z-index:2}
</style>
<!-- Icona d'app per a pantalla d'inici (iPhone/Android) -->
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<!-- Fitxer d'estils editable per tu (opcional): si existeix, sobreescriu els colors de dalt -->

</head>
<body class="view-map">

<div id="splash">
  <div class="slogo" id="splash-logo"></div>
  <div class="stxt" id="splash-txt">Preparant el viatge…</div>

</div>

<!-- Porta de contrasenya -->
<div id="gate" style="display:none">
  <div class="gbox">

<header>

<div id="fitxa">

    <div class="agarra" id="f-agarra"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   ⚙️ CONEXIÓ AMB EL GOOGLE SHEETS (LA BASE DE DADES)  ✅ CONNECTAT
   Pestanya "Llocs" — capçaleres:
     Nom, Categoria, Lat, Lng,
     DataInici  (opcional: "29/11/2026 10:00", "29-11-26 15:30",
                 "29 de novembre 10:00"…)
     DataFi     (opcional: per a TOTES les categories — mentre un
                 lloc té inici i fi, es mostra cada dia del rang)
     Origen     (opcional, per a transports: nom d'un altre lloc
                 del full o coordenades "41.39, 2.17")
     Desti      (opcional, per a transports)
     Maps      (opcional: enganxa un link de Google Maps i s'hi
                 extreuen les coordenades automàticament)
     Adreça    (opcional: "Sagrada Família, Barcelona" — es
                 converteix via Nominatim/OpenStreetMap)
     Nota, Link
   (La columna antiga "Dia" continua funcionant com a DataInici
    de text lliure, per compatibilitat.)
   Pestanya "Config" (Clau,Valor) — també admet claus color_*
   ============================================================ */
const SHEET_ID = "1tUIidz7rAFAQPBprGGwYSljTZ0styLm6aFFozYILFAs";

/* ---------- Marca de versió ----------
   Cada vegada que publiquis una versió nova a GitHub, canvia aquest
   número. Si el mòbil no mostra el número nou a la capçalera, vol dir
   que està executant una còpia antiga des de la caché.               */
const VERSIO = "v4.0";

/* ---------- Contrasenya ---------- */
const PASSWORD = "LaCasita";
const AUTH_KEY = "viatge_auth_v1";
const AUTH_DIES = 30;

/* ---------- Símbol de l'app: cabdell de llana vermell sobre bandera blanca ---------- */
function simbolSVG(mida){
  return `<svg viewBox="0 0 64 64" width="${mida}" height="${mida}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`
    +`<rect x="3" y="3" width="58" height="58" rx="12" fill="#ffffff" stroke="#e5def6" stroke-width="3"/>`
    +`<circle cx="31" cy="33" r="14.5" fill="#d2372c"/>`
    +`<g fill="none" stroke="#f3b7b1" stroke-width="2" stroke-linecap="round">`
    +`<path d="M18.5 28.5 Q31 21.5 43.5 28.5"/><path d="M17.5 35 Q31 28.5 44.5 35"/>`
    +`<path d="M20 41.5 Q31 35.5 42 41.5"/><path d="M27 19.5 Q21 33 27 46.5"/>`
    +`<path d="M36.5 19.8 Q42.5 33 36.5 46.2"/></g>`
    +`<path d="M45 36 q8 5 4 12" fill="none" stroke="#d2372c" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}
(function(){
  const fav=document.createElement('link'); fav.rel='icon';
  fav.href='data:image/svg+xml,'+encodeURIComponent(simbolSVG(64));
  document.head.appendChild(fav);
})();
document.getElementById('splash-logo').innerHTML = simbolSVG(64);
/* Splash rotativa: gos / cartell / cabdells com a fons, logo per sobre */
(function(){
  const FOTOS=["gos.png","cartell.png","cabdells.png"];
  const tria=FOTOS[Math.floor(Math.random()*FOTOS.length)]+"?v=40";
  const sp=document.getElementById('splash');
  if(sp && !sp.querySelector('.sfoto')){
    const f=document.createElement('div');
    f.className='sfoto';
    f.innerHTML='<img src="'+tria+'" alt="">';
    const v=document.createElement('div');
    v.className='svel';
    sp.prepend(v); sp.prepend(f);
  }
})();
document.getElementById('h-simbol').innerHTML = simbolSVG(20);

/* ---------- Categories fixes ----------
   Els noms d'aquí són FIXOS: cap dada del Sheet els pot canviar.     */
const CATS = {
  hotel:      {emoji:"🏨", nom:"Hotels",     color:"var(--c-hotel)"},
  activitat:  {emoji:"🎡", nom:"Activitats", color:"var(--c-activitat)"},
  transport:  {emoji:"🚆", nom:"Transports", color:"var(--c-transport)"},
  botiga:     {emoji:"🛍️", nom:"Botigues",   color:"var(--c-botiga)"},
  restaurant: {emoji:"🍽️", nom:"Restaurants",color:"var(--c-restaurant)"},
  cafeteria:  {emoji:"☕", nom:"Cafeteries", color:"var(--c-cafeteria)"},
};
const CLAUS_COLOR = {
  color_principal:"--pri", color_fons:"--fons", color_targeta:"--targeta",
  color_text:"--text", color_muted:"--muted",
  color_hotel:"--c-hotel", color_activitat:"--c-activitat", color_transport:"--c-transport",
  color_botiga:"--c-botiga", color_restaurant:"--c-restaurant", color_cafeteria:"--c-cafeteria",
};

/* ---------- Exemple (només si tot falla i no hi ha cau) ---------- */
const PLACES_EXEMPLE = [
  {nom:"Hotel Mar", cat:"hotel", lat:38.7223, lng:-9.1393, iniciTxt:"12/04/2027 15:00", fiTxt:"19/04/2027 11:00", nota:"Habitació doble", link:""},
];

/* ============================================================
   —— A partir d'aquí no cal tocar res ——
   ============================================================ */
const LS_CACHE  = "viatge_sheet_cache";
const LS_CONFIG = "viatge_config_cache";

let CONFIG = { nom:"Viatge", dates:"", centre:[38.72,-9.14], zoom:13 };
let PLACES_SHEET = [];
let PLACES = [];
let filtreCat = new Set(Object.keys(CATS));
let diaFiltre = "tots";            /* "tots" o clau numèrica del dia ("20261129") */
let marcadors = {};
let capesRutes = [];

function normalitzaCat(v){
  const s = String(v||"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/s$/,"");
  return CATS[s] ? s : null;
}
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; }
function escHTML(v){ return String(v ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function urlSegura(v){
  const raw=String(v ?? "").trim();
  if(!raw) return "";
  try{ const u=new URL(raw, location.href); return ["http:","https:","mailto:","tel:"].includes(u.protocol) ? u.href : ""; }
  catch(e){ return ""; }
}

/* ---------- v3.4: ubicació per link de Google Maps o adreça ---------- */
function coordsDeMapsLink(txt){
  if(!txt) return null;
  const t = decodeURIComponent(String(txt).trim());
  let m = t.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
  if(!m) m = t.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
  if(!m) m = t.match(/[?&]q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/);
  if(m){
    const la = parseFloat(m[1]), ln = parseFloat(m[2]);
    if(isFinite(la) && isFinite(ln) && Math.abs(la)<=90 && Math.abs(ln)<=180) return [la,ln];
  }
  return null;
}
const LS_GEO = "viatge_geo_cache";
function geoCauGet(clau){ try{ return JSON.parse(localStorage.getItem(LS_GEO)||"{}")[clau] ?? null; }catch(e){ return null; } }
function geoCauSet(clau,val){ try{ const c=JSON.parse(localStorage.getItem(LS_GEO)||"{}"); c[clau]=val; localStorage.setItem(LS_GEO,JSON.stringify(c)); }catch(e){} }
let geoCua = Promise.resolve();   /* cua per respectar el límit de Nominatim (1 cerca/segon) */
function geocodifica(adreca){
  return new Promise(res=>{
    geoCua = geoCua.then(async ()=>{
      const clau = "geo:"+adreca.toLowerCase();
      const cau = geoCauGet(clau);
      if(cau){ res(cau); return; }
      try{
        const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(adreca), {headers:{"Accept-Language":"ca"}});
        const d = await r.json();
        if(Array.isArray(d) && d.length){
          const val=[parseFloat(d[0].lat), parseFloat(d[0].lon)];
          geoCauSet(clau,val); res(val);
        }else{ geoCauSet(clau,null); res(null); }
      }catch(e){ res(null); }
      await new Promise(r2=>setTimeout(r2,1100));
    });
  });
}
/* resol un link curt (maps.app.goo.gl/...) seguint la redirecció via
   un servei intermediari, i extreu-hi les coordenades */
async function resolLinkCurt(url){
  const clau = "curt:"+url;
  const cau = geoCauGet(clau);
  if(cau) return cau;
  /* Estratègia 1: allorigins /get retorna JSON amb la URL FINAL de la
     redirecció — és allà on Google posa les coordenades (@lat,lng) */
  try{
    const r = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(url));
    const j = await r.json();
    const diana = (j && j.status && j.status.url) || "";
    const contingut = (j && j.contents) || "";
    let m = diana.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)
         || diana.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/)
         || diana.match(/(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(!m) m = contingut.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)
         || contingut.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
    if(m){
      const v = [parseFloat(m[1]), parseFloat(m[2])];
      if(isFinite(v[0]) && isFinite(v[1]) && Math.abs(v[0])<=90 && Math.abs(v[1])<=180){
        geoCauSet(clau, v); return v;
      }
    }
    console.warn("[Viatge] Link curt: no hi he trobat coordenades. URL final:", diana || "(cap)");
  }catch(e){ console.warn("[Viatge] Link curt via allorigins/get ha fallat:", e); }
  /* Estratègia 2: corsproxy seguint la redirecció, buscant dins el HTML */
  try{
    const r2 = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
    const t2 = await r2.text();
    const m2 = t2.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)
            || t2.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);
    if(m2){
      const v2 = [parseFloat(m2[1]), parseFloat(m2[2])];
      if(isFinite(v2[0]) && isFinite(v2[1])){ geoCauSet(clau, v2); return v2; }
    }
    console.warn("[Viatge] Link curt via corsproxy: res trobat.");
  }catch(e){ console.warn("[Viatge] Link curt via corsproxy ha fallat:", e); }
  /* Estratègia 3: servei unshorten (revela la URL de destinació) */
  try{
    const r3 = await fetch("https://unshorten.me/json/" + encodeURIComponent(url));
    const j3 = await r3.json();
    const d3 = (j3 && (j3.resolved_url || j3.ResolvedURL)) || "";
    const m3 = d3.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)
            || d3.match(/(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m3){
      const v3 = [parseFloat(m3[1]), parseFloat(m3[2])];
      if(isFinite(v3[0]) && isFinite(v3[1])){ geoCauSet(clau, v3); return v3; }
    }
    console.warn("[Viatge] Link curt via unshorten: URL revelada =", d3 || "(cap)");
  }catch(e){ console.warn("[Viatge] Link curt via unshorten ha fallat:", e); }
  return null;
}
async function resolUbicacions(llistat){
  for(const p of llistat){
    if(p.lat!==null && p.lng===null) {}
    if(p.lat!==null && p.lng!==null) continue;
    const delLink = coordsDeMapsLink(p.mapsTxt);
    if(delLink){ p.lat=delLink[0]; p.lng=delLink[1]; continue; }
    if(p.mapsTxt && /goo\.gl|maps\.app/i.test(p.mapsTxt)){
      const g = await resolLinkCurt(p.mapsTxt.trim());
      if(g){ p.lat=g[0]; p.lng=g[1]; continue; }
    }
    if(p.adrecaTxt){
      const g = await geocodifica(p.adrecaTxt);
      if(g){ p.lat=g[0]; p.lng=g[1]; }
    }
  }
  return llistat;
}

/* ---------- Dates i hores ----------
   Entén: "29/11/2026 10:00", "29-11-26 15:30", "29 de novembre 10:00",
   "3 des 18:00", mesos en català i castellà.                             */
const MES_CURT = ["gen","feb","mar","abr","mai","jun","jul","ago","set","oct","nov","des"];
const MESOS_L  = ["gener","febrer","març","abril","maig","juny","juliol","agost","setembre","octubre","novembre","desembre"];
const MESOS_MAP = {};
(function(){
  const mesos = [
    ["gener","gen","enero","ene"],
    ["febrer","feb","febrero"],
    ["marc","mar","margo","marzo"],
    ["abril","abr"],
    ["maig","may"],
    ["juny","jun"],
    ["juliol","jul","julio"],
    ["agost","ago","august","aug"],
    ["setembre","sep","septiembre","sept"],
    ["octubre","oct"],
    ["novembre","nov"],
    ["desembre","des","diciembre","dic","dec"],
  ];
  mesos.forEach((variants,m)=>variants.forEach(v=>MESOS_MAP[v]=m));
})();
function txtNorm(s){
  return String(s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
/* retorna {y,m,d,hh,mm,key} o null */
function parseDataHora(str){
  if(!str) return null;
  const s = txtNorm(str);
  let y=null,m=null,d=null;
  /* format numèric dd/mm/aa o dd-mm-yyyy */
  const numeric = s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?:\s*[\/\-.]\s*(\d{2,4}))?/);
  if(numeric){
    d = Math.min(+numeric[1],31); m = Math.min(+numeric[2],12)-1;
    if(numeric[3]) y = +numeric[3]<100 ? 2000+(+numeric[3]) : +numeric[3];
  }else{
    /* nom de mes dins el text */
    for(const [nom,mi] of Object.entries(MESOS_MAP)){
      const re = new RegExp("(^|[^a-z])"+nom+"([^a-z]|$)");
      if(re.test(s)){ m=mi; break; }
    }
    if(m===null) return null;
    const nd = s.match(/(\d{1,2})\b/);
    if(!nd) return null;
    d = Math.min(+nd[1],31);
  }
  /* hora hh:mm o hh h mm */
  let hh=null, mm=null;
  const hora = s.match(/(\d{1,2})\s*[:h\.]\s*(\d{2})\b/);
  if(hora && +hora[1]<=23){ hh=+hora[1]; mm=+hora[2]; }
  if(y===null) y = new Date().getFullYear();
  return {y, m, d, hh, mm, key: y*10000+(m+1)*100+d};
}
function etiquetaCerta(dt){           /* "29 nov" */
  return dt ? `${dt.d} ${MES_CURT[dt.m]}` : null;
}
function etiquetaCompleta(dt, anyMostra){ /* "29 de novembre 2026 · 10:00" */
  if(!dt) return null;
  let t = `${dt.d} de ${MESOS_L[dt.m]}`;
  if(anyMostra && dt.y!==anyMostra) t += ` ${dt.y}`;
  if(dt.hh!==null) t += ` · ${String(dt.hh).padStart(2,"0")}:${String(dt.mm).padStart(2,"0")}`;
  return t;
}
function iniciaDe(p){ return parseDataHora(p.iniciTxt) || parseDataHora(p.diaLegacy); }

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=""; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell); cell="";
        if(row.some(x=>x!=="")) rows.push(row); row=[]; }
      else cell+=c;
    }
  }
  row.push(cell); if(row.some(x=>x!=="")) rows.push(row);
  return rows;
}
function cap(url){
  return fetch(url, {redirect:"follow"}).then(r=>{
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  });
}

/* ---------- Vies de connexió: gviz CSV → JSONP → OpenSheet ---------- */
async function viaGviz(nom){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(nom)}`;
  const txt = await cap(url);
  if(txt.includes("<HTML") || txt.toLowerCase().includes("<!doctype html")) throw new Error("resposta HTML");
  return txt;
}
function viaJsonp(nom, timeoutMs=8000){
  return new Promise((resolve,reject)=>{
    const cb = "__gvis_cb_"+Date.now();
    const s = document.createElement('script');
    const t = setTimeout(()=>{ neteja(); reject(new Error("timeout")); }, timeoutMs);
    function neteja(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (json)=>{
      neteja();
      try{
        const cols = (json.table.cols||[]).map(c=>String(c.label||"").trim().toLowerCase());
        const rows = (json.table.rows||[]).map(r=>(r.c||[]).map(c=>c?String(c.v??""):""));
        resolve({cols, rows});
      }catch(e){ reject(e); }
    };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&sheet=${encodeURIComponent(nom)}`;
    s.onerror = ()=>{ neteja(); reject(new Error("script error")); };
    document.head.appendChild(s);
  });
}
async function viaOpenSheet(nom){
  const txt = await cap(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(nom)}`);
  const d = JSON.parse(txt);
  if(!Array.isArray(d)) throw new Error("format inesperat");
  return d;
}

/* ---------- Llocs ---------- */
function construeixPlace(raw){
  if(!raw.nom || !raw.cat) return null;
  const p = {
    nom:raw.nom, cat:raw.cat,
    lat:(raw.lat!==null && raw.lat!==undefined && raw.lat!=="" && Math.abs(raw.lat)<=90) ? raw.lat : null,
    lng:(raw.lng!==null && raw.lng!==undefined && raw.lng!=="" && Math.abs(raw.lng)<=180) ? raw.lng : null,
    mapsTxt:(raw.maps||"").trim(),
    adrecaTxt:(raw.adreca||"").trim(),
    diaLegacy:(raw.dia||"").trim(),
    iniciTxt:(raw.inici||"").trim(), fiTxt:(raw.fi||"").trim(),
    origen:(raw.origen||"").trim(), desti:(raw.desti||"").trim(),
    nota:raw.nota||"", link:raw.link||"",
  };
  p.inici = iniciaDe(p);
  p.fi    = parseDataHora(p.fiTxt);
  p.etq   = etiquetaCerta(p.inici);                      /* "29 nov" per a llistes */
  return p;
}
function rowsCsvAPlaces(csvTxt){
  const rows = parseCSV(csvTxt);
  const head = (rows.shift()||[]).map(h=>String(h).trim().toLowerCase());
  const idx = n => head.indexOf(n);
  return rows.map(r=>construeixPlace({
    nom:r[idx("nom")], cat:normalitzaCat(r[idx("categoria")]),
    lat:num(r[idx("lat")]), lng:num(r[idx("lng")]), maps:idx("maps")>=0?r[idx("maps")]:undefined, adreca:idx("adreca")>=0?r[idx("adreca")]:undefined,
    dia:r[idx("dia")],
    inici:idx("datainici")>=0?r[idx("datainici")]:undefined,
    fi:   idx("datafi")>=0?r[idx("datafi")]:undefined,
    origen:idx("origen")>=0?r[idx("origen")]:undefined,
    desti: idx("desti")>=0?r[idx("desti")]:undefined,
    nota:r[idx("nota")], link:r[idx("link")],
  })).filter(Boolean);
}
function jsonpAPlaces(cols, rows){
  const idx = n => cols.indexOf(n);
  return rows.map(r=>construeixPlace({
    nom:r[idx("nom")], cat:normalitzaCat(r[idx("categoria")]),
    lat:num(r[idx("lat")]), lng:num(r[idx("lng")]), maps:idx("maps")>=0?r[idx("maps")]:undefined, adreca:idx("adreca")>=0?r[idx("adreca")]:undefined,
    dia:r[idx("dia")],
    inici:idx("datainici")>=0?r[idx("datainici")]:undefined,
    fi:   idx("datafi")>=0?r[idx("datafi")]:undefined,
    origen:idx("origen")>=0?r[idx("origen")]:undefined,
    desti: idx("desti")>=0?r[idx("desti")]:undefined,
    nota:r[idx("nota")], link:r[idx("link")],
  })).filter(Boolean);
}
function objesAPlaces(objes){
  const g=(o,a,b)=>o[a]??o[b]??"";
  return objes.map(o=>construeixPlace({
    nom:o["Nom"]||o["nom"], cat:normalitzaCat(o["Categoria"]||o["categoria"]),
    lat:num(o["Lat"]??o["lat"]), lng:num(o["Lng"]??o["lng"]), maps:(o["Maps"]??o["maps"])??"", adreca:(o["Adreça"]??o["adreça"]??o["Adreca"]??o["adreca"])??"",
    dia:g(o,"Dia","dia"),
    inici:g(o,"DataInici","datainici"),
    fi:   g(o,"DataFi","datafi"),
    origen:g(o,"Origen","origen"),
    desti: g(o,"Desti","desti"),
    nota:o["Nota"]||o["nota"], link:o["Link"]||o["link"],
  })).filter(Boolean);
}
async function carregaPestanyaLlocs(){
  const intents = [];
  try{ return rowsCsvAPlaces(await viaGviz("Llocs")); }catch(e){ intents.push("gviz-csv: "+e.message); }
  try{
    const {cols, rows} = await viaJsonp("Llocs");
    const places = jsonpAPlaces(cols, rows);
    if(places.length || rows.length) return places;
    throw new Error("buit");
  }catch(e){ intents.push("gviz-jsonp: "+e.message); }
  try{ return objesAPlaces(await viaOpenSheet("Llocs")); }catch(e){ intents.push("opensheet: "+e.message); }
  throw new Error(intents.join(" · "));
}

function aplicaConfig(cfg){

/* ---------- Filtratge ----------
   diaFiltre = "tots" o la clau numèrica d'un dia (YYYYMMDD).
   PER A TOTES LES CATEGORIES: si un lloc té DataInici i DataFi,
   es mostra cada dia del rang (inclusiu). Si només té DataInici,
   es mostra el dia que coincideix.                                   */
let catsSel = new Set();          /* buit = es mostren totes */
function catPermesa(k){ return catsSel.size===0 || catsSel.has(k); }
function refrescaChips(){
  document.querySelectorAll('#filtres .chip[data-k]').forEach(b=>{
    const k=b.dataset.k, c=CATS[k];
    if(catsSel.has(k)){
      b.classList.add('on');
      b.style.background=c.color;                    /* color fort */
      b.style.color='#fff';
      b.style.borderColor='transparent';
    }else{
      b.classList.remove('on');
      b.style.background=`color-mix(in srgb, ${c.color} 30%, transparent)`;  /* mateix color, translúcid */
      b.style.color=c.color;
      b.style.borderColor=`color-mix(in srgb, ${c.color} 45%, transparent)`;
    }
  });
}
function passaFiltre(p){
  if(!catPermesa(p.cat)) return false;
  if(diaFiltre==="tots") return true;
  const k = Number(diaFiltre);
  if(p.inici && p.fi) return k>=p.inici.key && k<=p.fi.key;
  return p.inici ? p.inici.key===k : false;
}

/* ---------- Mapa ---------- */
const map = L.map('map').setView(CONFIG.centre, CONFIG.zoom);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

function icona(cat){
  const c = CATS[cat]||{emoji:"📍",color:"#888"};
  return L.divIcon({className:"", html:`<div class="pin" style="background:${c.color}"><span>${c.emoji}</span></div>`,
    iconSize:[34,34], iconAnchor:[17,32]});
}
/* resol un punt: coordenades "41.39, 2.17" o nom d'un altre lloc del full */
function resolPunt(txt){
  if(!txt) return null;
  const coords = txt.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.,]\d+)?)\s*$/);
  if(coords){
    const la=num(coords[1]), ln=num(coords[2]);
    if(la!==null && ln!==null) return [la,ln];
  }
  const t = txtNorm(txt).trim();
  let candidat = PLACES.find(p=>txtNorm(p.nom)===t);
  if(!candidat) candidat = PLACES.find(p=>txtNorm(p.nom).includes(t) || t.includes(txtNorm(p.nom)));
  return candidat ? [candidat.lat, candidat.lng] : null;
}
function refrescaMarcadors(){
  Object.values(marcadors).forEach(m=>map.removeLayer(m));
  capesRutes.forEach(l=>map.removeLayer(l));
  marcadors={}; capesRutes=[];
  PLACES.forEach((p,i)=>{
    if(!passaFiltre(p) || p.lat===null || p.lng===null) return;
    const m = L.marker([p.lat,p.lng],{icon:icona(p.cat), riseOnHover:true}).addTo(map);
    m.on('click', ()=>obreFitxa(i));
    marcadors[i]=m;
    /* traç origen→destí per a transports */
    if(p.cat==="transport" && (p.origen || p.desti)){
      const a = p.origen ? resolPunt(p.origen) : [p.lat,p.lng];
      const b = p.desti  ? resolPunt(p.desti)  : [p.lat,p.lng];
      if(a && b){
        const col = getComputedStyle(document.documentElement).getPropertyValue('--c-transport').trim() || '#0ea5a4';
        const linia = L.polyline([a,b],{color:col, weight:3, opacity:.85, dashArray:'7 9'}).addTo(map);
        const pinta = pt=>L.circleMarker(pt,{radius:5, color:'#fff', weight:2, fillColor:col, fillOpacity:1}).addTo(map);
        capesRutes.push(linia, pinta(a), pinta(b));
      }
    }
  });
}

/* ---------- Centrat del mapa segons el filtre ----------
   En canviar qualsevol filtre, el mapa s'ajusta per encabir tots els
   llocs resultants (punt mig + zoom automàtic). Si el mapa no és la
   pestanya visible (mòbil), queda pendent i s'aplica en obrir Mapa. */
let pendentCentrat = false;
function centraMapaEnFiltre(){
  const pts = PLACES.filter(p=>passaFiltre(p)&&p.lat!==null&&p.lng!==null).map(p=>[p.lat,p.lng]);
  if(!pts.length) return;                       /* res visible: no toquem el mapa */
  if(document.body.classList.contains('view-map')){
    if(pts.length===1) map.flyTo(pts[0], Math.max(map.getZoom(),14), {duration:.6});
    else map.flyToBounds(L.latLngBounds(pts), {padding:[50,50], maxZoom:16, duration:.7});
    pendentCentrat = false;
  }else{
    pendentCentrat = true;                      /* s'aplicarà en anar a Mapa */
  }
}

  if(teCoords) cos += `<div class="fila"><div class="fic">📍</div><div><div class="flabel">Ubicació</div><div class="fvalor">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div></div></div>`;
  if(p.link){ const href=urlSegura(p.link); cos += `<div class="fila"><div class="fic">🔗</div><div style="min-width:0"><div class="flabel">Enllaç</div><div class="fvalor" style="word-break:break-all">${href?`<a href="${escHTML(href)}" target="_blank" rel="noopener noreferrer" style="color:var(--pri);font-weight:700">${escHTML(p.link)}</a>`:escHTML(p.link)}</div></div></div>`; }
  document.getElementById('f-cos').innerHTML = cos;
  let acc = teCoords ? `<a class="f-acc-pri" style="--acc:${c.color}" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">🧭 Ani-hi</a>` : "";
  const href=urlSegura(p.link);
  if(href) acc += `<a class="f-acc-sec" href="${escHTML(href)}" target="_blank" rel="noopener noreferrer">🌐 Enllaç</a>`;
  if(teCoords) acc += `<button class="f-acc-sec" onclick="copiaCoords(${i})">📋 Coordenades</button>`;
  document.getElementById('f-accions').innerHTML = acc;

  fitxa.classList.remove('expans');
  fFull.scrollTop = 0;
  fFull.classList.remove('anim'); void fFull.offsetWidth; fFull.classList.add('anim');
  if(teCoords){
    const centre = map.getCenter();
    if(Math.abs(centre.lat-p.lat)>1e-4 || Math.abs(centre.lng-p.lng)>1e-4){
      map.flyTo([p.lat,p.lng], Math.max(map.getZoom()||13, 15), {duration:.6});

};

/* ---------- Ordenació cronològica ---------- */
function ordenaLlocs(arr){
  return arr.sort((a,b)=>{
    const ka=a.p.inici?a.p.inici.key:null, kb=b.p.inici?b.p.inici.key:null;
    if(ka!==null && kb!==null){
      if(ka!==kb) return ka-kb;
      const ta=a.p.inici.hh!==null?a.p.inici.hh*60+a.p.inici.mm:null;
      const tb=b.p.inici.hh!==null?b.p.inici.hh*60+b.p.inici.mm:null;
      if(ta!==null && tb!==null && ta!==tb) return ta-tb;
      return (a.p.diaLegacy||"").localeCompare(b.p.diaLegacy||"");
    }
    if(ka!==null) return -1;
    if(kb!==null) return 1;
    return (a.p.diaLegacy||"zzz").localeCompare(b.p.diaLegacy||"zzz");
  });
}

/* ---------- Llistes: mostren NOMÉS dia+mes (l'hora va a la fitxa) ---------- */
function refrescaLlistes(){
  let h="";
  Object.entries(CATS).forEach(([k,c])=>{
    if(!filtreCat.has(k)) return;
    const llocs=ordenaLlocs(PLACES.map((p,i)=>({p,i})).filter(o=>o.p.cat===k && passaFiltre(o.p)));
    if(!llocs.length) return;
    h+=`<div class="cat-title"><span class="dot" style="background:${c.color};color:${c.color}"></span>${c.nom} <small>(${llocs.length})</small></div>`;
    llocs.forEach(({p,i})=>{
      /* si té rang (inici+fi), la llista ho indica: "29 nov – 1 des" */
      const dataCurta = (p.inici && p.fi)
        ? `${p.etq} – ${etiquetaCerta(p.fi)}`
        : (p.etq || p.diaLegacy);
      h+=`<div class="item" onclick="obreFitxa(${i})"><div class="ico">${c.emoji}</div><div style="flex:1;min-width:0"><b>${escHTML(p.nom)}</b>${p.nota?`<p>${escHTML(p.nota)}</p>`:""}${dataCurta?`<div class="meta">📅 ${dataCurta}</div>`:""}</div><button class="go" onclick="event.stopPropagation();vesA(${i})">🗺️</button></div>`;
    });
  });
  document.getElementById('llistes').innerHTML = h || `<p style="text-align:center;color:var(--muted);margin-top:40px">Cap lloc amb els filtres actius 🙂</p>`;
}
/* ---------- Itinerari (grups de dia en ordre cronològic) ---------- */
function refrescaItinerari(){
  const vis = PLACES.map((p,i)=>({p,i})).filter(o=>passaFiltre(o.p));
  const grups=[];
  vis.forEach(o=>{
    const g = o.p.etq || o.p.diaLegacy || "(sense dia)";
    let gp=grups.find(x=>x.nom===g);
    if(!gp){ gp={nom:g, llocs:[], exemplar:o.p}; grups.push(gp); }
    gp.llocs.push(o);
  });
  grups.sort((a,b)=>{
    const ka=a.exemplar.inici?a.exemplar.inici.key:null;
    const kb=b.exemplar.inici?b.exemplar.inici.key:null;
    if(ka!==null && kb!==null) return ka-kb;
    if(ka!==null) return -1;
    if(kb!==null) return 1;
    return (a.nom||"").localeCompare(b.nom||"");
  });
  let h="";
  grups.forEach(g=>{
    h+=`<div class="dia-bloc"><div class="dia-cap">📆 ${g.nom} <span class="ndia">${g.llocs.length}</span></div><div class="timeline">`;
    ordenaLlocs(g.llocs).forEach(({p,i})=>{
      const c=CATS[p.cat]||{emoji:"📍",color:"#888"};
      const hora=(p.inici && p.inici.hh!==null)
        ? `${String(p.inici.hh).padStart(2,"0")}:${String(p.inici.mm).padStart(2,"0")}`
        : (p.diaLegacy && p.diaLegacy.indexOf("·")>0 ? p.diaLegacy.split("·").slice(1).join("·").trim() : "");
      const thoraTxt = hora || c.emoji+" "+(CATS[p.cat]?CATS[p.cat].nom:"");
      h+=`<div class="tstop" data-i="${i}" style="--dot:${c.color}">
        <div class="thora">${escHTML(thoraTxt)}</div>
        <div class="item" style="margin-bottom:0" onclick="obreFitxa(${i})"><div class="ico">${c.emoji}</div>
          <div style="flex:1;min-width:0"><b>${escHTML(p.nom)}</b>${p.nota?`<p>${escHTML(p.nota)}</p>`:""}</div>
          <button class="go" onclick="event.stopPropagation();vesA(${i})">🗺️</button></div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById('itinerari').innerHTML = h || `<p style="text-align:center;color:var(--muted);margin-top:40px">Cap lloc a l'itinerari amb els filtres actius 🙂</p>`;
}

/* El desplegable de dies cobreix el viatge SENCER: un dia per cada
   dia natural des de la primera activitat fins a l'última,
   inclosos els dies intermedis de les estades.                     */
function refrescaDies(){
  const dates=[];
  PLACES.forEach(p=>{
    if(p.inici) dates.push(p.inici);
    if(p.fi)    dates.push(p.fi);
    const dl = parseDataHora(p.diaLegacy);
    if(dl) dates.push(dl);
  });
  const previ = diaFiltre;
  if(!dates.length){
    diaFiltre="tots";
    selDia.innerHTML=`<option value="tots">📅 Tots els dies</option>`;
    return;
  }
  dates.sort((a,b)=>a.key-b.key);
  const primera=dates[0], ultima=dates[dates.length-1];
  const anysNous = primera.y !== ultima.y;
  const dies=[];
  const cursor = new Date(primera.y, primera.m, primera.d);
  const fiData = new Date(ultima.y, ultima.m, ultima.d);
  while(cursor <= fiData){
    const key = cursor.getFullYear()*10000 + (cursor.getMonth()+1)*100 + cursor.getDate();
    let label = `${cursor.getDate()} ${MES_CURT[cursor.getMonth()]}`;
    if(anysNous) label += ` ${cursor.getFullYear()}`;
    dies.push({key, label});
    cursor.setDate(cursor.getDate()+1);
  }
  selDia.innerHTML=`<option value="tots">📅 Tots els dies</option>` +
    dies.map(d=>`<option value="${d.key}">${d.label}</option>`).join("");
  if(previ!=="tots" && dies.some(d=>String(d.key)===String(previ))) selDia.value=String(previ);
  else { diaFiltre="tots"; selDia.value="tots"; }
}

/* ---------- Scroll de l'itinerari → el mapa segueix ----------
   En fer scroll dins la pestanya Itinerari, el mapa es desplaça
   suavament cap al lloc que estàs veient en aquell moment.         */
let itinScrollTick = false;
let ultimIdxSeguit = null;
document.getElementById('itinerari').addEventListener('scroll', ()=>{
  if(itinScrollTick) return;
  itinScrollTick = true;
  requestAnimationFrame(()=>{
    itinScrollTick = false;
    if(!document.body.classList.contains('view-itin')) return;
    if(fitxa.classList.contains('open')) return;      /* no moguem el mapa mentre mires una fitxa */
    const contenidor = document.getElementById('itinerari').getBoundingClientRect();
    const referencia = contenidor.top + Math.min(140, contenidor.height*0.3);
    let idx = null;
    document.querySelectorAll('#itinerari .tstop[data-i]').forEach(el=>{
      const r = el.getBoundingClientRect();
      if(idx===null && r.bottom > referencia) idx = +el.dataset.i;
    });
    if(idx===null){
      const tots = document.querySelectorAll('#itinerari .tstop[data-i]');
      if(tots.length) idx = +tots[tots.length-1].dataset.i;
    }
    if(idx!==null && idx!==ultimIdxSeguit && PLACES[idx]){
      ultimIdxSeguit = idx;
      const p = PLACES[idx];
      if(p.lat!==null && p.lng!==null) map.panTo([p.lat, p.lng], {animate:true, duration:.5});
    }
  });
}, {passive:true});
/* reinicia el seguiment quan torbes a pujar o canvies de pestanya */
document.getElementById('itinerari').addEventListener('scroll', ()=>{

}, {passive:true});

/* ---------- Sincro ---------- */
async function sincro(){
  let ok=false, motiu="";
  if(!navigator.onLine){ motiu = "Sembla que no hi ha connexió a internet."; }
  else{
    try{
      const llocs = await carregaPestanyaLlocs();
      await resolUbicacions(llocs);
      const config = await carregaPestanyaConfig();
      aplicaConfig(config);
      PLACES_SHEET = llocs;
      localStorage.setItem(LS_CACHE, JSON.stringify(llocs));
      localStorage.setItem(LS_CONFIG, JSON.stringify(config));
      map.setView(CONFIG.centre, CONFIG.zoom);
      ok = true;
    }catch(e){
      motiu = String(e.message||e);
      console.warn("[Viatge] Error de sincronització:", e);
    }
  }
  if(!ok){
    let teniaCau=false;
    try{
      PLACES_SHEET=JSON.parse(localStorage.getItem(LS_CACHE)||"null")||[];
      aplicaConfig(JSON.parse(localStorage.getItem(LS_CONFIG)||"null"));
      teniaCau = PLACES_SHEET.length>0;
    }catch(e2){ PLACES_SHEET=[]; }
    if(!PLACES_SHEET.length) PLACES_SHEET=PLACES_EXEMPLE;
    avisa(`⚠️ No s'ha pogut sincronitzar amb Google Sheets${motiu?`<br><small style="font-weight:500">Motiu: ${escHTML(motiu)}</small>`:""}<br><small style="font-weight:500">${teniaCau?"Es mostren les dades de l'última sincronització.":"Cap cau: es mostra l'exemple."}</small>`, 12000);
  }
  PLACES = [...PLACES_SHEET];
  refrescaDies();
  refrescaTot();
  amagaSplash();
}

/* ---------- Porta de contrasenya ---------- */
function jaAutoritzat(){
  try{
    const a = JSON.parse(localStorage.getItem(AUTH_KEY)||"null");

  }catch(e){ return false; }

function marcaAutoritzat(){
  localStorage.setItem(AUTH_KEY, JSON.stringify({

  }));
}

})();
/* PWA: registra el service worker i comprova si n'hi ha una versió nova.
   Es torna a comprovar en recuperar la connexió i en tornar a obrir l'app. */
if('serviceWorker' in navigator){
  const sw = navigator.serviceWorker;
  let jaTeControlador = !!sw.controller;
  let recarregaPerActualitzacio = false;

  async function registraIComprovaActualitzacio(){
    try{
      const registre = await sw.register('./sw.js');
      await registre.update();
    }catch(e){
      console.warn('[Viatge] No s’ha pogut comprovar l’actualització de l’app:', e);
    }
  }

  // Si ja hi havia una versió controlant la pàgina, recarreguem una sola
  // vegada quan la nova versió passa a controlar-la.
  sw.addEventListener('controllerchange', ()=>{
    if(jaTeControlador && !recarregaPerActualitzacio){
      recarregaPerActualitzacio = true;
      window.location.reload();
    }
    jaTeControlador = true;
  });

  window.addEventListener('load', registraIComprovaActualitzacio);
  window.addEventListener('online', registraIComprovaActualitzacio);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') registraIComprovaActualitzacio();
  });
}
