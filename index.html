<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d4aff">
<title>Viatge — Mapa del viatge</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   🎨 COLORS BASE — es poden sobreescriure al fitxer estils.css
   (pujat al costat d'aquest index.html a GitHub) i també des
   del Google Sheet, pestanya Config (claus color_*).
   Ordre de prioritat: base < estils.css < Sheet
   ============================================================ */
:root{
  --pri:#6d4aff;
  --fons:#f4f1fc;
  --targeta:rgba(255,255,255,.68);
  --text:#221a44;
  --muted:#6f6795;
  --borde:rgba(109,74,255,.14);
  --c-hotel:#6d4aff;
  --c-activitat:#e8618c;
  --c-transport:#0ea5a4;
  --c-botiga:#e8963c;
  --c-restaurant:#d94f3d;
  --c-cafeteria:#8a6440;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);overflow:hidden}
body{
  background:linear-gradient(155deg,#efe9ff 0%,#fdeef5 38%,#eaf7f6 72%,#f7f2e8 100%);
  background-attachment:fixed;
  display:flex;flex-direction:column;
}
/* ---------- Pantalla de càrrega ---------- */
#splash{
  position:fixed;inset:0;z-index:6000;
  background:linear-gradient(160deg,#f6f3ff 0%,#fdf1f6 55%,#eff8f7 100%);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  transition:opacity .45s ease;
}
#splash.amaga{opacity:0;pointer-events:none}
#splash .slogo{
  width:84px;height:84px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  font-size:44px;background:linear-gradient(135deg,var(--pri),#a46bff);
  box-shadow:0 14px 40px rgba(109,74,255,.35);
}
#splash .stxt{font-size:15px;font-weight:700;color:var(--muted)}
#splash .spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(109,74,255,.2);border-top-color:var(--pri);animation:giro 1s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
/* ---------- Capçalera aurora ---------- */
header{
  background:linear-gradient(135deg,rgba(109,74,255,.92),rgba(232,97,140,.82));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;padding:14px 16px calc(10px + env(safe-area-inset-top));padding-top:calc(10px + env(safe-area-inset-top));flex:none;
  box-shadow:0 4px 24px rgba(109,74,255,.25);
}
h1{font-size:19px;font-weight:800;letter-spacing:.2px}
.dates{font-size:13px;opacity:.88;margin-top:2px}
.sincc{font-size:11.5px;opacity:.78;margin-top:4px}
.counts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.counts span{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:3px 9px;font-size:12px;font-weight:600}
/* ---------- Filtres vidre ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;flex:none;align-items:center}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;border:1px solid var(--borde);border-radius:22px;padding:7px 13px;font-size:13.5px;font-weight:600;
  background:var(--targeta);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--muted);box-shadow:0 2px 10px rgba(34,26,68,.07);cursor:pointer;transition:.15s;
}
.chip.on{color:#fff;border-color:transparent}
select.chip{appearance:none;-webkit-appearance:none;font-family:inherit;outline:none;max-width:220px;white-space:nowrap}
/* ---------- Panells: la visibilitat depèn de la classe del body ----------
   view-map  → només mapa
   view-llis → només llistes
   view-itin → només itinerari                                             */
#content{flex:1;position:relative;overflow:hidden}
#map{position:absolute;top:0;left:0;right:0;bottom:64px;display:none;border-radius:0}
.main{position:absolute;top:0;left:0;right:0;bottom:64px;overflow-y:auto;padding:4px 14px 28px;display:none}
body.view-map  #map{display:block}
body.view-llis #llistes{display:block}
body.view-itin #itinerari{display:block}
/* ---------- Targetes vidre ---------- */
.cat-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin:18px 2px 8px;letter-spacing:.2px}
.cat-title .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 10px currentColor}
.cat-title small{color:var(--muted);font-weight:600;font-size:13px}
.item{
  background:var(--targeta);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--borde);border-radius:16px;
  box-shadow:0 4px 18px rgba(34,26,68,.08);
  padding:13px 15px;margin-bottom:10px;display:flex;gap:11px;align-items:flex-start;
  transition:transform .15s, box-shadow .15s;
}
.item:active{transform:scale(.985)}
.item .ico{font-size:22px;line-height:1.2;flex-shrink:0}
.item b{font-size:15px}
.item p{font-size:13px;color:var(--muted);margin-top:2px;white-space:pre-line}
.item .meta{font-size:12px;color:var(--pri);font-weight:700;margin-top:4px}
.item .go{margin-left:auto;flex-shrink:0;border:none;background:rgba(109,74,255,.12);color:var(--pri);border-radius:10px;
          padding:8px 10px;font-size:15px;font-weight:700;cursor:pointer}
/* ---------- Pin ---------- */
.pin{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50% 50% 50% 4px;
     transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 4px 14px rgba(34,26,68,.35);font-size:16px}
.pin > span{transform:rotate(45deg)}
/* ---------- Navegació ---------- */
nav{position:absolute;left:0;right:0;bottom:0;height:64px;
    background:var(--targeta);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom);z-index:1200;display:flex}
nav button{flex:1;border:none;background:none;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ni{font-size:20px}
nav button.on{color:var(--pri)}
/* ---------- Escriptori: mapa + panell dret (mostra la pestanya activa) ---------- */
@media (min-width:900px){
  #map{right:42%;bottom:0;display:block !important}
  body.view-llis #llistes,
  body.view-itin #itinerari{left:58%;bottom:0;border-left:1px solid var(--borde);display:block !important}
  nav{left:58%;width:42%}
}
/* ---------- Itinerari ---------- */
.dia-bloc{margin:18px 0 6px}
.dia-cap{display:inline-flex;align-items:center;gap:8px;background:var(--targeta);backdrop-filter:blur(14px);
  border:1px solid var(--borde);border-radius:20px;padding:7px 16px;font-weight:800;font-size:15px;
  box-shadow:0 3px 12px rgba(34,26,68,.09);margin-bottom:12px}
.dia-cap .ndia{background:var(--pri);color:#fff;border-radius:14px;font-size:12px;padding:2px 9px}
.timeline{position:relative;margin-left:10px;padding-left:20px;border-left:2.5px solid rgba(109,74,255,.25)}
.tstop{position:relative;margin-bottom:14px}
.tstop::before{
  content:"";position:absolute;left:-27.5px;top:14px;width:13px;height:13px;border-radius:50%;
  background:var(--dot,#6d4aff);border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(109,74,255,.2), 0 2px 8px rgba(34,26,68,.25);
}
.tstop .thora{font-size:12px;font-weight:800;color:var(--dot,#6d4aff)}
/* ---------- Avís ---------- */
.aviso{position:absolute;left:12px;right:12px;top:12px;z-index:1500;
  background:rgba(255,244,229,.95);backdrop-filter:blur(10px);color:#8a5a00;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;
  box-shadow:0 6px 20px rgba(34,26,68,.15);display:none;max-height:40vh;overflow-y:auto}
/* ---------- Fitxa detall (finestra separada en tocar un pin) ----------
   Dos estats: col·lapsada (mitja pantalla) i expandida (gairebé tota).
   Gestos: lliscar AMUNT → expandir · lliscar AVALL → tancar          */
#fitxa{position:fixed;inset:0;z-index:3000;display:none;align-items:flex-end;justify-content:center}
#fitxa.open{display:flex}
#fitxa .fons{position:absolute;inset:0;background:rgba(34,26,68,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#fitxa .full{
  position:relative;width:100%;max-width:560px;max-height:62vh;overflow-y:auto;overscroll-behavior:contain;
  background:rgba(255,255,255,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:26px 26px 0 0;box-shadow:0 -12px 40px rgba(34,26,68,.3);
  transition:max-height .28s ease, transform .2s ease;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  touch-action:pan-y;
}
#fitxa.expans .full{max-height:94vh}
@keyframes puge{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
#fitxa .full.anim{animation:puge .28s ease}
#fitxa .agarra{width:44px;height:5px;border-radius:3px;background:rgba(34,26,68,.18);margin:12px auto 4px}
#fitxa .tanca{position:absolute;top:14px;right:14px;border:none;width:36px;height:36px;border-radius:50%;
  background:rgba(34,26,68,.08);color:var(--muted);font-size:17px;font-weight:800;cursor:pointer;z-index:2}
#fitxa .fh{display:flex;align-items:center;gap:14px;padding:10px 22px 6px;cursor:grab}
#fitxa .femoji{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#fff;flex-shrink:0;box-shadow:0 6px 18px rgba(34,26,68,.25)}
#fitxa .ftitul{font-size:20px;font-weight:800;line-height:1.25}
#fitxa .fcat{font-size:12.5px;font-weight:700;margin-top:3px}
#fitxa .fcos{padding:6px 22px}
#fitxa .fila{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--borde)}
#fitxa .fila:last-child{border-bottom:none}
#fitxa .fic{font-size:19px;flex-shrink:0;line-height:1.3}
#fitxa .flabel{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#fitxa .fvalor{font-size:14.5px;margin-top:1px;white-space:pre-line}
#fitxa .faccions{display:flex;gap:10px;padding:16px 22px 4px;flex-wrap:wrap}
#fitxa .faccions a,#fitxa .faccions button{
  flex:1;min-width:140px;text-align:center;border:none;border-radius:14px;padding:13px 10px;
  font-size:14.5px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .12s}
#fitxa .faccions a:active{transform:scale(.97)}
.f-acc-pri{background:var(--acc,#6d4aff);color:#fff;box-shadow:0 5px 16px rgba(34,26,68,.25)}
.f-acc-sec{background:rgba(109,74,255,.12);color:var(--pri)}
/* ---------- Porta de contrasenya ---------- */
#gate{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#6d4aff 0%,#a46bff 45%,#e8618c 100%);}
#gate::before{content:"";position:absolute;inset:0;

#gate .gbox{position:relative;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);

  box-shadow:0 20px 60px rgba(34,26,68,.35);text-align:center}
#gate .gmasc{font-size:44px}
#gate h2{font-size:18px;font-weight:800;margin:10px 0 4px}
#gate p{font-size:13.5px;color:var(--muted);margin-bottom:16px}
#gate input{width:100%;border:1.5px solid #ddd8ee;border-radius:14px;padding:13px 14px;font-size:16px;
  text-align:center;letter-spacing:2px;background:#fff;outline:none}
#gate input:focus{border-color:var(--pri)}
#gate .err{color:#d94f3d;font-size:13px;font-weight:700;margin-top:10px;display:none}
#gate button{width:100%;margin-top:14px;border:none;background:linear-gradient(135deg,#6d4aff,#a46bff);color:#fff;border-radius:14px;
  padding:13px;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(109,74,255,.4)}
#gate button:active{transform:scale(.98)}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   ⚙️ CONEXIÓ AMB EL GOOGLE SHEETS (LA BASE DE DADES)  ✅ CONNECTAT
   Pestanyes: "Llocs" (Nom,Categoria,Lat,Lng,Dia,Nota,Link)
              "Config" (Clau,Valor) — també admet claus color_*
   ============================================================ */
const SHEET_ID = "1tUIidz7rAFAQPBprGGwYSljTZ0styLm6aFFozYILFAs";

/* ---------- Contrasenya ---------- */
const PASSWORD = "LaCasita";
const AUTH_KEY = "viatge_auth_v1";
const AUTH_DIES = 30;

/* ---------- Categories: colors lligats a les variables CSS ---------- */
const CATS = {
  hotel:      {emoji:"🏨", nom:"Hotels",     color:"var(--c-hotel)"},
  activitat:  {emoji:"🎡", nom:"Activitats", color:"var(--c-activitat)"},
  transport:  {emoji:"🚆", nom:"Transports", color:"var(--c-transport)"},
  botiga:     {emoji:"🛍️", nom:"Botigues",   color:"var(--c-botiga)"},
  restaurant: {emoji:"🍽️", nom:"Restaurants",color:"var(--c-restaurant)"},
  cafeteria:  {emoji:"☕", nom:"Cafeteries", color:"var(--c-cafeteria)"},
};
const CLAUS_COLOR = {
  color_principal:"--pri", color_fons:"--fons", color_targeta:"--targeta",
  color_text:"--text", color_muted:"--muted",
  color_hotel:"--c-hotel", color_activitat:"--c-activitat", color_transport:"--c-transport",
  color_botiga:"--c-botiga", color_restaurant:"--c-restaurant", color_cafeteria:"--c-cafeteria",
};

/* ---------- Exemple (només si tot falla i no hi ha cau) ---------- */
const PLACES_EXEMPLE = [
  {nom:"Hotel Mar", cat:"hotel", lat:38.7223, lng:-9.1393, dia:"Dl 12 · check-in 15h", nota:"Habitació doble", link:""},
];

/* ============================================================
   —— A partir d'aquí no cal tocar res ——
   ============================================================ */
const LS_CACHE  = "viatge_sheet_cache";
const LS_CONFIG = "viatge_config_cache";

let CONFIG = { nom:"Viatge", dates:"", centre:[38.72,-9.14], zoom:13 };
let PLACES_SHEET = [];
let PLACES = [];
let filtreCat = new Set(Object.keys(CATS));
let diaFiltre = "tots";
let marcadors = {};

function normalitzaCat(v){
  const s = String(v||"").trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/s$/,"");
  return CATS[s] ? s : null;
}
function num(v){ const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; }

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=""; }
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cell); cell="";
        if(row.some(x=>x!=="")) rows.push(row); row=[]; }
      else cell+=c;
    }
  }
  row.push(cell); if(row.some(x=>x!=="")) rows.push(row);
  return rows;
}
function cap(url){
  return fetch(url, {redirect:"follow"}).then(r=>{
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  });
}

/* ---------- Vies de connexió: gviz CSV → JSONP → OpenSheet ---------- */
async function viaGviz(nom){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(nom)}`;
  const txt = await cap(url);
  if(txt.includes("<HTML") || txt.toLowerCase().includes("<!doctype html")) throw new Error("resposta HTML");
  return txt;
}
function viaJsonp(nom, timeoutMs=8000){
  return new Promise((resolve,reject)=>{
    const cb = "__gvis_cb_"+Date.now();
    const s = document.createElement('script');
    const t = setTimeout(()=>{ neteja(); reject(new Error("timeout")); }, timeoutMs);
    function neteja(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (json)=>{
      neteja();
      try{
        const cols = (json.table.cols||[]).map(c=>String(c.label||"").trim().toLowerCase());
        const rows = (json.table.rows||[]).map(r=>(r.c||[]).map(c=>c?String(c.v??""):""));
        resolve({cols, rows});
      }catch(e){ reject(e); }
    };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cb}&sheet=${encodeURIComponent(nom)}`;
    s.onerror = ()=>{ neteja(); reject(new Error("script error")); };
    document.head.appendChild(s);
  });
}
async function viaOpenSheet(nom){
  const txt = await cap(`https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(nom)}`);
  const d = JSON.parse(txt);
  if(!Array.isArray(d)) throw new Error("format inesperat");
  return d;
}
function rowsCsvAPlaces(csvTxt){
  const rows = parseCSV(csvTxt);
  const head = (rows.shift()||[]).map(h=>String(h).trim().toLowerCase());
  const idx = n => head.indexOf(n);
  return rows.map(r=>({
    nom:r[idx("nom")]||"", cat:normalitzaCat(r[idx("categoria")]),
    lat:num(r[idx("lat")]), lng:num(r[idx("lng")]),
    dia:r[idx("dia")]||"", nota:r[idx("nota")]||"", link:r[idx("link")]||"",
  })).filter(p=>p.nom && p.cat && p.lat!==null && p.lng!==null);
}
function csvAConfig(csvTxt){
  const config = {};
  parseCSV(csvTxt).forEach(r=>{ if(r[0]) config[String(r[0]).trim()] = (r[1]||"").trim(); });
  return config;
}
function jsonpAPlaces(cols, rows){
  const idx = n => cols.indexOf(n);
  return rows.map(r=>({
    nom:r[idx("nom")]||"", cat:normalitzaCat(r[idx("categoria")]),
    lat:num(r[idx("lat")]), lng:num(r[idx("lng")]),
    dia:r[idx("dia")]||"", nota:r[idx("nota")]||"", link:r[idx("link")]||"",
  })).filter(p=>p.nom && p.cat && p.lat!==null && p.lng!==null);
}
function jsonpAConfig(cols, rows){
  const config = {}; const iC=cols.indexOf("clau"), iV=cols.indexOf("valor");
  if(iC>=0) rows.forEach(r=>{ if(r[iC]) config[String(r[iC]).trim()]=(r[iV]||"").trim(); });
  return config;
}
function objesAPlaces(objes){
  return objes.map(o=>({
    nom:o["Nom"]||o["nom"]||"", cat:normalitzaCat(o["Categoria"]||o["categoria"]),
    lat:num(o["Lat"]??o["lat"]), lng:num(o["Lng"]??o["lng"]),
    dia:o["Dia"]||o["dia"]||"", nota:o["Nota"]||o["nota"]||"", link:o["Link"]||o["link"]||"",
  })).filter(p=>p.nom && p.cat && p.lat!==null && p.lng!==null);
}
async function carregaPestanyaLlocs(){
  const intents = [];
  try{ return rowsCsvAPlaces(await viaGviz("Llocs")); }catch(e){ intents.push("gviz-csv: "+e.message); }
  try{
    const {cols, rows} = await viaJsonp("Llocs");
    const places = jsonpAPlaces(cols, rows);
    if(places.length || rows.length) return places;
    throw new Error("buit");
  }catch(e){ intents.push("gviz-jsonp: "+e.message); }
  try{ return objesAPlaces(await viaOpenSheet("Llocs")); }catch(e){ intents.push("opensheet: "+e.message); }
  throw new Error(intents.join(" · "));
}
async function carregaPestanyaConfig(){
  try{ return csvAConfig(await viaGviz("Config")); }catch(e){}
  try{ const {cols, rows} = await viaJsonp("Config"); return jsonpAConfig(cols, rows); }catch(e){}
  try{
    const objes = await viaOpenSheet("Config");
    const config = {};
    objes.forEach(o=>{ const k=o["Clau"]||o["clau"]; if(k) config[k.trim()]=(o["Valor"]||o["valor"]||"").trim(); });
    return config;
  }catch(e){}
  return null;
}
function aplicaConfig(cfg){
  if(!cfg) return;
  const lat=num(cfg["centre_lat"]), lng=num(cfg["centre_lng"]);
  CONFIG = {
    nom:   cfg["nom"]  || CONFIG.nom,
    dates: cfg["dates"]|| CONFIG.dates,
    centre:[ lat!==null?lat:CONFIG.centre[0], lng!==null?lng:CONFIG.centre[1] ],
    zoom:  num(cfg["zoom"]) ?? CONFIG.zoom,
  };
  Object.entries(CLAUS_COLOR).forEach(([clau,varCss])=>{
    const v = cfg[clau];
    if(v && /^#?[0-9a-fA-F]{3,8}$/.test(v.trim())){
      document.documentElement.style.setProperty(varCss, v.trim().startsWith("#")?v.trim():"#"+v.trim());
    }
  });
}

/* ---------- Filtratge ---------- */
function passaFiltre(p){
  if(!filtreCat.has(p.cat)) return false;
  if(diaFiltre!=="tots" && (p.dia||"")!==diaFiltre) return false;
  return true;
}

/* ---------- Mapa ---------- */
const map = L.map('map').setView(CONFIG.centre, CONFIG.zoom);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);

function icona(cat){
  const c = CATS[cat]||{emoji:"📍",color:"#888"};
  return L.divIcon({className:"", html:`<div class="pin" style="background:${c.color}"><span>${c.emoji}</span></div>`,
    iconSize:[34,34], iconAnchor:[17,32]});
}
function refrescaMarcadors(){
  Object.values(marcadors).forEach(m=>map.removeLayer(m));
  marcadors={};
  PLACES.forEach((p,i)=>{
    if(!passaFiltre(p)) return;
    const m = L.marker([p.lat,p.lng],{icon:icona(p.cat), riseOnHover:true}).addTo(map);
    m.on('click', ()=>obreFitxa(i));
    marcadors[i]=m;
  });
}

/* ---------- Fitxa de detall amb gestos ---------- */
const fitxa = document.getElementById('fitxa');
const fFull = document.getElementById('f-full');
let dragY=null, dragActiu=false;

function obreFitxa(i){
  const p = PLACES[i];
  if(!p) return;
  const c = CATS[p.cat]||{emoji:"📍", nom:"Lloc", color:"#888"};
  document.getElementById('f-emoji').textContent = c.emoji;
  document.getElementById('f-emoji').style.background = c.color;
  document.getElementById('f-nom').textContent = p.nom;
  document.getElementById('f-cat').textContent = c.nom;
  document.getElementById('f-cat').style.color = c.color;
  let cos = "";
  if(p.dia) cos += `<div class="fila"><div class="fic">📅</div><div><div class="flabel">Quan</div><div class="fvalor" style="font-weight:700;color:${c.color}">${p.dia}</div></div></div>`;
  if(p.nota) cos += `<div class="fila"><div class="fic">📝</div><div><div class="flabel">Notes</div><div class="fvalor">${p.nota}</div></div></div>`;
  cos += `<div class="fila"><div class="fic">📍</div><div><div class="flabel">Ubicació</div><div class="fvalor">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div></div></div>`;
  if(p.link) cos += `<div class="fila"><div class="fic">🔗</div><div style="min-width:0"><div class="flabel">Enllaç</div><div class="fvalor" style="word-break:break-all"><a href="${p.link}" target="_blank" style="color:var(--pri);font-weight:700">${p.link}</a></div></div></div>`;
  document.getElementById('f-cos').innerHTML = cos;
  let acc = `<a class="f-acc-pri" style="--acc:${c.color}" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">🧭 Ani-hi</a>`;
  if(p.link) acc += `<a class="f-acc-sec" href="${p.link}" target="_blank">🌐 Enllaç</a>`;
  acc += `<button class="f-acc-sec" onclick="copiaCoords(${i})">📋 Coordenades</button>`;
  document.getElementById('f-accions').innerHTML = acc;
  fitxa.classList.add('open');
  fitxa.classList.remove('expans');
  fFull.scrollTop = 0;
  fFull.classList.remove('anim'); void fFull.offsetWidth; fFull.classList.add('anim');
}
function tancaFitxa(){ fitxa.classList.remove('open','expans'); fFull.style.transform=""; }
document.getElementById('f-tancar').onclick = tancaFitxa;
document.getElementById('f-tancar-fons').onclick = tancaFitxa;
document.getElementById('f-agarra').onclick = ()=>fitxa.classList.toggle('expans');
document.getElementById('f-cap').onclick = (e)=>{ if(e.target.closest('a,button')) return; fitxa.classList.toggle('expans'); };

/* Gestos: lliscar amunt = expandir · lliscar avall = tancar */
fFull.addEventListener('touchstart', e=>{
  dragY = e.touches[0].clientY; dragActiu = true;
}, {passive:true});
fFull.addEventListener('touchmove', e=>{
  if(!dragActiu || dragY===null) return;
  const dy = e.touches[0].clientY - dragY;
  const aDalt = fFull.scrollTop <= 0;
  const pucTancar = (!fitxa.classList.contains('expans')) || aDalt;
  if(dy < -40){                       // lliscar AMUNT → expandir
    fitxa.classList.add('expans'); dragActiu=false; fFull.style.transform="";
  }else if(dy > 50 && pucTancar){     // lliscar AVALL → tancar
    dragActiu=false; fFull.style.transform="";
    tancaFitxa();
  }else if((dy>0 && pucTancar) || dy<0){
    fFull.style.transform = `translateY(${dy/2}px)`;
  }
}, {passive:true});
fFull.addEventListener('touchend', ()=>{
  dragActiu=false; dragY=null; fFull.style.transform="";
}, {passive:true});

window.copiaCoords = function(i){
  const p = PLACES[i];
  navigator.clipboard?.writeText(`${p.lat}, ${p.lng}`).then(
    ()=>alert("Coordenades copiades ✅"),
    ()=>{}
  );
};

/* ---------- Llistes (cada categoria només mostra els SEUS llocs) ---------- */
function refrescaLlistes(){
  let h="";
  Object.entries(CATS).forEach(([k,c])=>{
    if(!filtreCat.has(k)) return;
    const llocs=PLACES.map((p,i)=>({p,i}))
      .filter(o=>o.p.cat===k && passaFiltre(o.p))
      .sort((a,b)=>(a.p.dia||"zzz").localeCompare(b.p.dia||"zzz"));
    if(!llocs.length) return;
    h+=`<div class="cat-title"><span class="dot" style="background:${c.color};color:${c.color}"></span>${c.nom} <small>(${llocs.length})</small></div>`;
    llocs.forEach(({p,i})=>{
      h+=`<div class="item" onclick="obreFitxa(${i})"><div class="ico">${c.emoji}</div><div style="flex:1;min-width:0"><b>${p.nom}</b>${p.nota?`<p>${p.nota}</p>`:""}${p.dia?`<div class="meta">📅 ${p.dia}</div>`:""}</div><button class="go" onclick="event.stopPropagation();vesA(${i})">🗺️</button></div>`;
    });
  });
  document.getElementById('llistes').innerHTML = h || `<p style="text-align:center;color:var(--muted);margin-top:40px">Cap lloc amb els filtres actius 🙂</p>`;
}
/* ---------- Itinerari ---------- */
function grupDeDia(dia){
  if(!dia) return "(sense dia)";
  const i = dia.indexOf("·");
  return i>0 ? dia.slice(0,i).trim() : dia.trim();
}
function refrescaItinerari(){
  const vis = PLACES.map((p,i)=>({p,i})).filter(o=>passaFiltre(o.p));
  const grups=[];
  vis.forEach(o=>{
    const g=grupDeDia(o.p.dia);
    let gp=grups.find(x=>x.nom===g);
    if(!gp){ gp={nom:g, llocs:[]}; grups.push(gp); }
    gp.llocs.push(o);
  });
  let h="";
  grups.forEach(g=>{
    h+=`<div class="dia-bloc"><div class="dia-cap">📆 ${g.nom} <span class="ndia">${g.llocs.length}</span></div><div class="timeline">`;
    g.llocs.sort((a,b)=>(a.p.dia||"").localeCompare(b.p.dia||"")).forEach(({p,i})=>{
      const c=CATS[p.cat]||{emoji:"📍",color:"#888"};
      const hora=(p.dia&&p.dia.indexOf("·")>0)?p.dia.split("·").slice(1).join("·").trim():"";
      h+=`<div class="tstop" style="--dot:${c.color}">
        <div class="thora">${hora||c.emoji+" "+(CATS[p.cat]?CATS[p.cat].nom:"")}</div>
        <div class="item" style="margin-bottom:0" onclick="obreFitxa(${i})"><div class="ico">${c.emoji}</div>
          <div style="flex:1;min-width:0"><b>${p.nom}</b>${p.nota?`<p>${p.nota}</p>`:""}</div>
          <button class="go" onclick="event.stopPropagation();vesA(${i})">🗺️</button></div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  document.getElementById('itinerari').innerHTML = h || `<p style="text-align:center;color:var(--muted);margin-top:40px">Cap lloc a l'itinerari amb els filtres actius 🙂</p>`;
}
function vesA(i){
  setTab('map');
  map.flyTo([PLACES[i].lat,PLACES[i].lng],16,{duration:.8});
  setTimeout(()=>obreFitxa(i), 850);
}
window.vesA=vesA;
window.obreFitxa=obreFitxa;
function refrescaTot(){
  refrescaMarcadors(); refrescaLlistes(); refrescaItinerari();
  const visibles = PLACES.filter(passaFiltre).length;
  document.getElementById('counts').innerHTML =
    `<span>👁️ ${visibles} visibles</span>` +
    Object.entries(CATS).map(([k,x])=>{
      const n = PLACES.filter(p=>p.cat===k && (diaFiltre==="tots" || p.dia===diaFiltre)).length;
      return `<span>${x.emoji} ${n}</span>`;
    }).join("");
  document.getElementById('titol').textContent = CONFIG.nom;
  document.getElementById('dates').textContent = CONFIG.dates;
  document.getElementById('sincc').textContent = PLACES_SHEET.length
    ? `🔗 Sincronitzat amb Google Sheets · ${new Date().toLocaleString('ca-ES')}`
    : "⚠️ Sense dades del Sheet";
}

/* ---------- Filtres ---------- */
const fCont = document.getElementById('filtres');

/* Botó "Mostra-ho tot" (un sol click) */
const bTotes=document.createElement('button');
bTotes.className='chip on';
bTotes.textContent='✨ Tot';
bTotes.title="Mostra totes les categories i tots els dies";
bTotes.onclick=()=>{
  filtreCat = new Set(Object.keys(CATS));
  document.querySelectorAll('#filtres .chip[data-k]').forEach(b=>{
    b.classList.add('on');
    b.style.background = CATS[b.dataset.k].color;
  });
  diaFiltre="tots"; selDia.value="tots";
  refrescaTot();
};
fCont.appendChild(bTotes);

Object.entries(CATS).forEach(([k,c])=>{
  const b=document.createElement('button');
  b.className='chip on'; b.style.background=c.color;
  b.textContent=`${c.emoji} ${c.nom}`;
  b.dataset.k=k;
  b.onclick=()=>{
    if(filtreCat.has(k)){filtreCat.delete(k);b.classList.remove('on');b.style.background='';}
    else{filtreCat.add(k);b.classList.add('on');b.style.background=c.color;}
    refrescaTot();
  };
  fCont.appendChild(b);
});
const selDia=document.createElement('select');
selDia.className='chip';
selDia.title="Filtra per dia";
selDia.innerHTML=`<option value="tots">📅 Tots els dies</option>`;
selDia.onchange=()=>{ diaFiltre=selDia.value; refrescaTot(); };
fCont.appendChild(selDia);

function refrescaDies(){
  const dies=[...new Set(PLACES.map(p=>grupDeDia(p.dia)).filter(d=>d!=="(sense dia)"))];
  const previ=diaFiltre;
  selDia.innerHTML=`<option value="tots">📅 Tots els dies</option>` +
    dies.map(d=>`<option value="${d.replace(/"/g,"&quot;")}">${d}</option>`).join("");
  if(dies.includes(previ)) selDia.value=previ; else { diaFiltre="tots"; selDia.value="tots"; }
}

/* ---------- Tabs: la classe del body controla què es veu ---------- */
function setTab(qui){
  document.body.classList.remove('view-map','view-llis','view-itin');
  document.body.classList.add('view-'+qui);
  document.getElementById('tab-map').classList.toggle('on', qui==='map');
  document.getElementById('tab-llis').classList.toggle('on', qui==='llis');
  document.getElementById('tab-itin').classList.toggle('on', qui==='itin');
}
document.getElementById('tab-map').onclick =()=>setTab('map');
document.getElementById('tab-llis').onclick=()=>setTab('llis');
document.getElementById('tab-itin').onclick=()=>setTab('itin');
setTimeout(()=>map.invalidateSize(),100);
window.addEventListener('resize', ()=>map.invalidateSize());

function avisa(html, ms){
  const a=document.getElementById('aviso');
  a.innerHTML=html; a.style.display='block';
  if(ms) setTimeout(()=>a.style.display='none',ms);
}

/* ---------- Pantalla de càrrega ---------- */
const splash=document.getElementById('splash');
function mostraSplash(){ splash.classList.remove('amaga'); }
function amagaSplash(){ splash.classList.add('amaga'); }
/* Seguretat: mai més de 12 segons carregant */
setTimeout(amagaSplash, 12000);

/* ---------- Sincro ---------- */
async function sincro(){
  let ok=false, motiu="";
  if(!navigator.onLine){ motiu = "Sembla que no hi ha connexió a internet."; }
  else{
    try{
      const llocs = await carregaPestanyaLlocs();
      const config = await carregaPestanyaConfig();
      aplicaConfig(config);
      PLACES_SHEET = llocs;
      localStorage.setItem(LS_CACHE, JSON.stringify(llocs));
      localStorage.setItem(LS_CONFIG, JSON.stringify(config));
      map.setView(CONFIG.centre, CONFIG.zoom);
      ok = true;
    }catch(e){
      motiu = String(e.message||e);
      console.warn("[Viatge] Error de sincronització:", e);
    }
  }
  if(!ok){
    let teniaCau=false;
    try{
      PLACES_SHEET=JSON.parse(localStorage.getItem(LS_CACHE)||"null")||[];
      aplicaConfig(JSON.parse(localStorage.getItem(LS_CONFIG)||"null"));
      teniaCau = PLACES_SHEET.length>0;
    }catch(e2){ PLACES_SHEET=[]; }
    if(!PLACES_SHEET.length) PLACES_SHEET=PLACES_EXEMPLE;
    avisa(`⚠️ No s'ha pogut sincronitzar amb Google Sheets${motiu?`<br><small style="font-weight:500">Motiu: ${motiu}</small>`:""}<br><small style="font-weight:500">${teniaCau?"Es mostren les dades de l'última sincronització.":"Cap cau: es mostra l'exemple."}</small>`, 12000);
  }
  PLACES = [...PLACES_SHEET];
  refrescaDies();
  refrescaTot();
  amagaSplash();
}

/* ---------- Porta de contrasenya ---------- */
function jaAutoritzat(){
  try{
    const a = JSON.parse(localStorage.getItem(AUTH_KEY)||"null");
    return a && a.tok===btoa(PASSWORD) && Date.now() < a.exp;
  }catch(e){ return false; }
}
function marcaAutoritzat(){
  localStorage.setItem(AUTH_KEY, JSON.stringify({
    tok: btoa(PASSWORD),
    exp: Date.now() + AUTH_DIES*24*60*60*1000
  }));
}
(function iniciaGate(){
  const gate=document.getElementById('gate');
  if(jaAutoritzat()){
    sincro();               // la pantalla de càrrega tapa l'app fins que hi ha dades
  }else{
    amagaSplash();          // la porta cobreix tota la pantalla de totes maneres
    gate.style.display='flex';
    document.getElementById('g-btn').onclick = ()=>{
      const v = document.getElementById('g-pass').value.trim();
      if(v === PASSWORD){
        marcaAutoritzat();
        gate.style.display='none';
        mostraSplash();     // tapa el mapa mentre es sincronitza
        sincro();
      }else{
        document.getElementById('g-err').style.display='block';
        document.getElementById('g-pass').value='';
      }
    };
    document.getElementById('g-pass').addEventListener('keydown', e=>{
      if(e.key==='Enter') document.getElementById('g-btn').click();
    });
  }
})();
</script>
